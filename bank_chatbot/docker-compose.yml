services:
  # Note: Using existing PostgreSQL container (chatbot_postgres) on port 5432
  # If you need a separate postgres, uncomment below and use a different port
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: bank-chatbot-postgres
  #   environment:
  #     POSTGRES_DB: bank_chatbot
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  #   ports:
  #     - "5434:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - chatbot-network

  redis:
    image: redis:7-alpine
    container_name: bank-chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-network

  location_service:
    build:
      context: ../location_service
      dockerfile: Dockerfile
    container_name: bank-chatbot-location-service
    ports:
      - "8004:8004"
    environment:
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-bank_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    networks:
      - chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8004/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-chatbot-api
    ports:
      - "8001:8001"
    volumes:
      # Mount application code for automatic updates (no rebuild needed)
      - ./app:/app/app
      - ./main.py:/app/main.py
      # Note: requirements.txt is NOT mounted to avoid dependency issues
      # If you add new dependencies, rebuild the container
    environment:
      # OpenAI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.7}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-2000}
      
      # PostgreSQL Configuration (using existing postgres container or host)
      # Force host.docker.internal for Docker container to access host PostgreSQL
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-bank_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      
      # Redis Configuration (use service name for Docker networking)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-3600}
      
      # LightRAG Configuration
      # Force host.docker.internal for Docker container to access host LightRAG
      LIGHTRAG_URL: http://host.docker.internal:9262/query
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-MyCustomLightRagKey456}
      LIGHTRAG_KNOWLEDGE_BASE: ${LIGHTRAG_KNOWLEDGE_BASE:-default}
      LIGHTRAG_TIMEOUT: ${LIGHTRAG_TIMEOUT:-30}
      
      # Card Rates Microservice
      CARD_RATES_URL: ${CARD_RATES_URL:-http://host.docker.internal:8002}
      
      # Fee Engine Microservice (New)
      FEE_ENGINE_URL: ${FEE_ENGINE_URL:-http://host.docker.internal:8003}
      
      # Location Service
      LOCATION_SERVICE_URL: ${LOCATION_SERVICE_URL:-http://location_service:8004}
      
      # Chat Settings
      MAX_CONVERSATION_HISTORY: ${MAX_CONVERSATION_HISTORY:-10}
      ENABLE_STREAMING: ${ENABLE_STREAMING:-True}
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-https://dia.ebl-bd.com,http://localhost:3000}
      
      # Debug
      DEBUG: ${DEBUG:-False}

      # Employee AD login
      AUTH_ENABLED: ${AUTH_ENABLED:-True}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-in-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      LDAP_SERVER: ${LDAP_SERVER:-}
      LDAP_PORT: ${LDAP_PORT:-389}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_USER: ${LDAP_BIND_USER:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USE_SSL: ${LDAP_USE_SSL:-False}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-ebl.bd}
      LDAP_NETBIOS_DOMAIN: ${LDAP_NETBIOS_DOMAIN:-EBL}
      LDAP_EMAIL_DOMAIN: ${LDAP_EMAIL_DOMAIN:-@ebl-bd.com}
      LDAP_CONNECT_TIMEOUT: ${LDAP_CONNECT_TIMEOUT:-10}
      LDAP_AUTH_SEARCH_BASE: ${LDAP_AUTH_SEARCH_BASE:-}
      LDAP_USERS_OU: ${LDAP_USERS_OU:-}
      LDAP_DEFAULT_USER_PASSWORD: ${LDAP_DEFAULT_USER_PASSWORD:-Ebl123}
      LDAP_PROVISION_ENABLED: ${LDAP_PROVISION_ENABLED:-False}

      # Lead generation (chat capture + status queries)
      ENABLE_LEAD_GENERATION: ${ENABLE_LEAD_GENERATION:-True}
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-}

      # EBL Home intranet indexes (forms, apps, leadership)
      ENABLE_EBLHOME_FORMS: ${ENABLE_EBLHOME_FORMS:-True}
      ENABLE_EBLHOME_APPS: ${ENABLE_EBLHOME_APPS:-True}
      ENABLE_EBLHOME_LEADERSHIP: ${ENABLE_EBLHOME_LEADERSHIP:-True}
      ENABLE_EBLHOME_SOC: ${ENABLE_EBLHOME_SOC:-True}
      ENABLE_EBLHOME_PROPOSALS: ${ENABLE_EBLHOME_PROPOSALS:-True}
      ENABLE_EBLHOME_CIRCULARS: ${ENABLE_EBLHOME_CIRCULARS:-True}
      EBLHOME_BASE_URL: ${EBLHOME_BASE_URL:-http://eblhome}
      EBLHOME_MYSQL_HOST: ${EBLHOME_MYSQL_HOST:-192.168.3.57}
      EBLHOME_MYSQL_PORT: ${EBLHOME_MYSQL_PORT:-3306}
      EBLHOME_MYSQL_DB: ${EBLHOME_MYSQL_DB:-ebl_home}
      EBLHOME_MYSQL_USER: ${EBLHOME_MYSQL_USER:-tanvir}
      EBLHOME_MYSQL_PASSWORD: ${EBLHOME_MYSQL_PASSWORD:-tanvir}
      EBLHOME_FETCH_BASE_URL: ${EBLHOME_FETCH_BASE_URL:-http://192.168.3.57}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}

      # Semantic intent router (local ONNX embeddings; off by default)
      ENABLE_SEMANTIC_ROUTER: ${ENABLE_SEMANTIC_ROUTER:-False}
      SEMANTIC_ROUTER_MODE: ${SEMANTIC_ROUTER_MODE:-shadow}
      SEMANTIC_ROUTER_THRESHOLD: ${SEMANTIC_ROUTER_THRESHOLD:-0.62}
      SEMANTIC_ROUTER_MODEL: ${SEMANTIC_ROUTER_MODEL:-BAAI/bge-small-en-v1.5}
      FASTEMBED_CACHE_DIR: ${FASTEMBED_CACHE_DIR:-/app/.fastembed_cache}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../bank_chatbot_frontend
      dockerfile: Dockerfile
    container_name: bank-chatbot-frontend
    ports:
      - "3000:3000"
    depends_on:
      - chatbot
    networks:
      - chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    build:
      context: ../chatbot_dashboard
      dockerfile: Dockerfile
      args:
        VITE_ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-}
    container_name: bank-chatbot-dashboard
    ports:
      - "3001:3001"
    depends_on:
      - chatbot
    networks:
      - chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  lead-portal:
    build:
      context: ../lead_portal
      dockerfile: Dockerfile
    container_name: bank-lead-portal
    ports:
      - "3002:3002"
    depends_on:
      - chatbot
    networks:
      - chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # HTTPS gateway — https://dia.ebl-bd.com (wildcard *.ebl-bd.com cert)
  gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: bank-chatbot-gateway
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ../star_ebl-bd_com_2026/star_ebl-bd_com.crt:/etc/nginx/ssl/server.crt:ro
      - ../star_ebl-bd_com_2026/DigiCertCA.crt:/etc/nginx/ssl/intermediate.crt:ro
      - ../star_ebl-bd_com_2026/wildcard_ebl-bd_com.key:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      frontend:
        condition: service_healthy
      chatbot:
        condition: service_healthy
    networks:
      - chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null --no-check-certificate https://localhost/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  redis_data:

networks:
  chatbot-network:
    driver: bridge
